<svg width="480" height="250" viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: transparent; stroke: #d0d7de; stroke-width: 1.4; }
    .calendar-icon { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2328; }
    .pill { fill: transparent; stroke: #57606a; stroke-width: 1.2; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 1.2px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #57606a; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #6e7781; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
    .date-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6e7781; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0969da; }

    @media (prefers-color-scheme: dark) {
      .card-bg { stroke: #30363d; }
      .calendar-icon { stroke: #a78bfa; }
      .title { fill: #e6edf3; }
      .pill { stroke: #8b949e; }
      .pill-text { fill: #8b949e; }
      .sub { fill: #8b949e; }
      .desc { fill: #8b949e; }
      .date-text { fill: #8b949e; }
      .repo-link { fill: #58a6ff; }
    }
  </style>

  <rect x="1" y="1" width="478" height="248" rx="18" class="card-bg"/>

  <g transform="translate(26,22)" class="calendar-icon">
    <rect x="1" y="3" width="14" height="13" rx="2"/>
    <path d="M4 0 V5"/>
    <path d="M12 0 V5"/>
    <path d="M1 7 H15"/>
  </g>

  <text x="52" y="39" class="title">일정은 딱 지금부터!</text>

  <rect x="340" y="21" width="112" height="22" rx="11" class="pill"/>
  <text x="396" y="35.5" text-anchor="middle" class="pill-text">CAPSTONE</text>

  <text x="28" y="66" class="sub">Schedule Management Webpage with a Digital Pet</text>

  <text x="28" y="92" class="desc">A web platform that combines schedule management</text>
  <text x="28" y="108" class="desc">with a digital pet to motivate users and encourage</text>
  <text x="28" y="124" class="desc">consistent task completion.</text>

  <g>
    <rect x="28" y="146" width="56" height="24" rx="3" fill="#007396"/>
    <text x="56" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">Java</text>

    <rect x="96" y="146" width="104" height="24" rx="3" fill="#6DB33F"/>
    <text x="148" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">Spring Boot</text>

    <rect x="212" y="146" width="74" height="24" rx="3" fill="#003545"/>
    <text x="249" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">MariaDB</text>

    <rect x="298" y="146" width="60" height="24" rx="3" fill="#FF69B4"/>
    <text x="328" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">Figma</text>

    <rect x="370" y="146" width="46" height="24" rx="3" fill="#F05032"/>
    <text x="393" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">Git</text>
  </g>

  <text x="28" y="224" class="date-text">2023.09.01 ~ 2024.06.12</text>
  <text x="452" y="224" text-anchor="end" class="repo-link">Repository →</text>
</svg>
