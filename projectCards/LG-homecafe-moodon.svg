<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: transparent; stroke: #d0d7de; stroke-width: 1.4; }
    .coffee-icon { fill: none; stroke: #6F4E37; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2328; }
    .pill { fill: transparent; stroke: #57606a; stroke-width: 1.2; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 1.2px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #57606a; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #6e7781; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
    .date-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6e7781; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0969da; }

    @media (prefers-color-scheme: dark) {
      .card-bg { stroke: #30363d; }
      .coffee-icon { stroke: #C69C6D; }
      .title { fill: #e6edf3; }
      .pill { stroke: #8b949e; }
      .pill-text { fill: #8b949e; }
      .sub { fill: #8b949e; }
      .desc { fill: #8b949e; }
      .date-text { fill: #8b949e; }
      .repo-link { fill: #58a6ff; }
    }
  </style>

  <rect x="1" y="1" width="478" height="218" rx="18" class="card-bg"/>

  <g transform="translate(26,22)" class="coffee-icon">
    <path d="M1 7 H13 V15 a3 3 0 0 1 -3 3 H4 a3 3 0 0 1 -3 -3 Z"/>
    <path d="M13 8.5 q3 0 3 3 t-3 3"/>
    <path d="M4 4.5 q1 -1.8 0 -3.5"/>
    <path d="M8 4.5 q1 -1.8 0 -3.5"/>
  </g>

  <text x="52" y="39" class="title">LG 홈카페 무드온</text>

  <rect x="340" y="21" width="112" height="22" rx="11" class="pill"/>
  <text x="396" y="35.5" text-anchor="middle" class="pill-text">BOOT CAMP</text>

  <text x="28" y="66" class="sub">Final Project · LG Electronics DX School 4th</text>

  <text x="28" y="92" class="desc">Analyzing customer reviews to identify pain points</text>
  <text x="28" y="110" class="desc">and build backend solutions</text>

  <g>
    <rect x="28" y="134" width="104" height="24" rx="3" fill="#6DB33F"/>
    <text x="80" y="150" text-anchor="middle" class="chip-text" fill="#ffffff">Spring Boot</text>

    <rect x="144" y="134" width="70" height="24" rx="3" fill="#3776AB"/>
    <text x="179" y="150" text-anchor="middle" class="chip-text" fill="#ffffff">Python</text>

    <rect x="226" y="134" width="96" height="24" rx="3" fill="#4169E1"/>
    <text x="274" y="150" text-anchor="middle" class="chip-text" fill="#ffffff">PostgreSQL</text>

    <rect x="334" y="134" width="50" height="24" rx="3" fill="#232F3E"/>
    <text x="359" y="150" text-anchor="middle" class="chip-text" fill="#FF9900">AWS</text>
  </g>

  <text x="28" y="192" class="date-text">2026.02.19 ~ 2026.03.27</text>
  <text x="452" y="192" text-anchor="end" class="repo-link">Repository →</text>
</svg>
