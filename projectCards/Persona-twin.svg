<svg width="480" height="250" viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: transparent; stroke: #d0d7de; stroke-width: 1.4; }
    .heart-icon { fill: none; stroke: #6e7781; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1f2328; }
    .pill { fill: transparent; stroke: #57606a; stroke-width: 1.2; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 1.2px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #57606a; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #6e7781; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
    .date-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #6e7781; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0969da; }

    @media (prefers-color-scheme: dark) {
      .card-bg { stroke: #30363d; }
      .heart-icon { stroke: #8b949e; }
      .title { fill: #e6edf3; }
      .pill { stroke: #8b949e; }
      .pill-text { fill: #8b949e; }
      .sub { fill: #8b949e; }
      .desc { fill: #8b949e; }
      .date-text { fill: #8b949e; }
      .repo-link { fill: #58a6ff; }
    }
  </style>

  <rect x="1" y="1" width="478" height="248" rx="18" class="card-bg"/>

  <g transform="translate(26,23)" class="heart-icon">
    <path d="M8 13.5 C8 13.5 1.5 9 1.5 4.8 C1.5 2.3 3.5 0.8 5.5 0.8 C7 0.8 7.6 1.8 8 2.6 C8.4 1.8 9 0.8 10.5 0.8 C12.5 0.8 14.5 2.3 14.5 4.8 C14.5 9 8 13.5 8 13.5 Z"/>
    <path d="M2 7 H5.5 L7 4 L9 10 L10.5 7 H14"/>
  </g>

  <text x="52" y="39" class="title">Persona Twin</text>

  <rect x="340" y="21" width="112" height="22" rx="11" class="pill"/>
  <text x="396" y="35.5" text-anchor="middle" class="pill-text">COMPANY</text>

  <text x="28" y="66" class="sub">Persona Agent for Expert Tacit Knowledge</text>

  <text x="28" y="92" class="desc">Developing a persona-based AI agent to capture and</text>
  <text x="28" y="108" class="desc">transform experts' tacit knowledge into reusable</text>
  <text x="28" y="124" class="desc">organizational assets. <tspan font-style="italic">(In Progress)</tspan></text>

  <g>
    <rect x="28" y="146" width="70" height="24" rx="3" fill="#3776AB"/>
    <text x="63" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">Python</text>

    <rect x="110" y="146" width="92" height="24" rx="3" fill="#4169E1"/>
    <text x="156" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">PostgreSQL</text>

    <rect x="214" y="146" width="66" height="24" rx="3" fill="#412991"/>
    <text x="247" y="162" text-anchor="middle" class="chip-text" fill="#ffffff">OpenAI</text>
  </g>

  <g>
    <rect x="28" y="178" width="88" height="24" rx="3" fill="#121212"/>
    <text x="72" y="194" text-anchor="middle" class="chip-text" fill="#ffffff">LangGraph</text>

    <rect x="128" y="178" width="66" height="24" rx="3" fill="#2496ED"/>
    <text x="161" y="194" text-anchor="middle" class="chip-text" fill="#ffffff">Docker</text>

    <rect x="206" y="178" width="46" height="24" rx="3" fill="#F05032"/>
    <text x="229" y="194" text-anchor="middle" class="chip-text" fill="#ffffff">Git</text>
  </g>

  <text x="28" y="224" class="date-text">2026.07.07 ~ current</text>
</svg>
